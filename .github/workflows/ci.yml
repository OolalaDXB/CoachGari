name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Deploying only what a push touched is right for ordinary work, but it leaves no way to
  # redeploy after something changed outside a push — a secret arriving late, a function
  # deployed by hand that has drifted from the repo. This gives one.
  workflow_dispatch:
    inputs:
      functions:
        description: 'Edge Functions to deploy: a comma-separated list, or "all"'
        required: true
        default: all
        type: string

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint HTML
        run: npx --yes htmlhint "index.html" "routes/**/*.html"

      - name: Check internal links & assets
        run: node scripts/check-links.mjs

      - name: Stripe webhook signature verification (offline, Stripe's scheme)
        run: node scripts/test-webhook-signature.mjs
      # --experimental-strip-types: these suites import the shared .ts modules directly,
      # so they assert the code that actually ships instead of a copy. The flag is explicit
      # rather than relying on the default type stripping of a particular Node 22 patch.
      - name: Collaborations — functional/security checks (offline)
        run: node --experimental-strip-types scripts/test-collab.mjs
      - name: Bearer tokens never reach a URL, history or stored attribution (offline)
        run: node scripts/test-url-scrub.mjs
      - name: IP identity — trusted hop, fail-closed salt, no PII in logs (offline)
        run: node scripts/test-contact-ip.mjs
      - name: Web Push sender — encryption round-trip and VAPID (offline)
        run: node --experimental-strip-types scripts/test-push.mjs
      - name: Transactional email rendering and outbox drain (offline)
        run: node --experimental-strip-types scripts/test-email.mjs
      # The three suites below drive a real browser. The runner ships neither Playwright nor
      # a browser, and the repo has no package.json to install from, so both are installed
      # here explicitly. If this step fails the job fails: a browser suite that cannot run
      # must not look like a browser suite that passed.
      - name: Install Playwright and Chromium
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - name: Back-office workspace — RPC surface and secret hygiene (offline)
        run: node scripts/test-admin-workspace.mjs
      - name: Back-office PWA shell (offline)
        run: node scripts/test-admin-pwa.mjs
      - name: Booking picker (offline)
        run: node scripts/test-booking-picker.mjs
      - name: Stripe adapter — embedded Checkout contract (offline)
        run: node --experimental-strip-types scripts/test-stripe-embedded.mjs
      - name: Audience — platform CSV import (offline)
        run: node scripts/test-audience-csv.mjs
      - name: Audience sync — key gate, secret hygiene, one source per failure (offline)
        run: node scripts/test-audience-sync.mjs

      - name: Verify config is valid ES module
        run: node --input-type=module -e "import('./config.js').then(m => { if (!m.CONFIG) { console.error('CONFIG export missing'); process.exit(1); } console.log('config.js OK'); })"

  # Database boundary tests — booking, payments/ledger, permissions/RLS, collaborations.
  # Every suite is a rollback transaction, nothing is persisted. A violated access
  # boundary fails the build.
  #
  # These suites need a connection to the real schema, and the only database this
  # project has is production. Handing GitHub Actions a production database credential
  # is a bigger concession than the coverage is worth, so the secret is deliberately
  # NOT set: the suites are run by hand against the live schema (rolled back) on every
  # change, which is how they have always actually been run.
  #
  # The job therefore announces the gap loudly and passes, rather than failing every
  # build or — worse — passing silently as if it had vouched for anything. If a
  # SUPABASE_DB_URL secret is ever added, it starts running them for real with no
  # further change. It is deliberately NOT a dependency of the deploy job below.
  db-boundary-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Not run here (no SUPABASE_DB_URL secret — suites are run by hand)
        if: env.DATABASE_URL == ''
        run: echo "::warning::The database boundary suites (RLS, permissions, collaborations) did NOT run in CI. This build does not vouch for them — they are run manually against the live schema in a rolled-back transaction. See scripts/db-tests.sh."
      - name: Install psql
        if: env.DATABASE_URL != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run rollback suites
        if: env.DATABASE_URL != ''
        run: bash scripts/db-tests.sh

  # Edge Functions — deployed from main with the same multi-file bundles the
  # project has always used (scripts/deploy-functions.mjs). Runs only when the
  # SUPABASE_ACCESS_TOKEN secret is set; only the functions whose bundle
  # contains a changed file are redeployed. Never on pull requests or branches.
  deploy-edge-functions:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [static-checks]   # the offline suites gate production; the DB suites are run by hand (see above)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'acrjrlgeeyseyolmofuq' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skipped (no SUPABASE_ACCESS_TOKEN secret)
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::SUPABASE_ACCESS_TOKEN not set — Edge Functions are not deployed automatically. Add the secret to enable it."
      - name: Deploy the functions touched by this push
        if: env.SUPABASE_ACCESS_TOKEN != '' && github.event_name == 'push'
        run: node scripts/deploy-functions.mjs --changed "${{ github.event.before }}"
      - name: Deploy on request
        if: env.SUPABASE_ACCESS_TOKEN != '' && github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.functions }}" = "all" ]; then
            node scripts/deploy-functions.mjs
          else
            node scripts/deploy-functions.mjs --only "${{ inputs.functions }}"
          fi
