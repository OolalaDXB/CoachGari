<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Payment | Coach Gari</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#15181d; --grey:#5c636e; --line:#e6e8ec; --bg:#f5f6f8; --card:#fff; --accent:#1540E8; --accent-pale:#F3F5FE; --ok:#0a7d3c; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 64px;}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:19px;margin:0 0 18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin-bottom:16px;}
  h1{font-size:21px;letter-spacing:-.02em;margin:0 0 4px;}
  .amount{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px;}
  .ref{font-size:12.5px;color:var(--grey);font-weight:600;letter-spacing:.04em;}
  .muted{color:var(--grey);font-size:14px;}
  .state{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--accent-pale);color:var(--accent);}
  .state.ok{background:#e8f6ee;color:var(--ok);}
  .state.off{background:#f1f2f4;color:var(--grey);}
  #mount{margin-top:14px;min-height:60px;}
  .err{color:#a12a2a;}
  .foot{font-size:12.5px;color:var(--grey);text-align:center;margin-top:22px;}
  .foot a{color:var(--grey);}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Coach Gari<i>.</i></p>
  <div class="card">
    <div id="head"><p class="muted">Opening your payment…</p></div>
    <div id="mount"></div>
    <p id="status" class="muted" role="status" aria-live="polite"></p>
  </div>
  <p class="foot">Paid securely by card. Coach Gari never sees your card details.</p>
</div>

<script type="module" src="/assets/pay.js"></script>
</body>
</html>
